# CP4D artifact-level backup — ACTION blueprint (BackupAction preHook).
#
# Wired to the policy that backs up the `cp4d-projects-backup` namespace via:
#   spec.actions[].backupParameters.preHook: { blueprint: cp4d-projects-backup-bp, actionName: backupPrehook }
#
# The preHook runs BEFORE Kasten's PVC discovery, so every per-project PVC it creates
# is included in the restore point. It runs as a KubeTask in kasten-io (cluster-wide
# Kasten SA) and delegates all real work to orchestrate.sh baked into the keeper image.
apiVersion: cr.kanister.io/v1alpha1
kind: Blueprint
metadata:
  name: cp4d-projects-backup-bp
  namespace: kasten-io
actions:
  backupPrehook:
    phases:
      - func: KubeTask
        name: exportAllProjects
        args:
          namespace: kasten-io          # cluster-wide Kasten SA: read cpd cred secret + manage PVCs/pods in BACKUP_NS
          image: docker.io/michaelcourcy/cp4d-backup:1.8.244-3
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              export BACKUP_NS="{{ .Namespace.Name }}"          # = cp4d-projects-backup (the namespace being backed up)
              export IMAGE="docker.io/michaelcourcy/cp4d-backup:1.8.244-3"
              export STORAGE_CLASS="managed-csi"                # cluster-specific CSI snapshot class (see README)
              export KEEPER_SA="cp4d-backup-keeper"
              export CRED_NS="cpd"                              # credential secret lives OUTSIDE the backed-up ns
              export CRED_SECRET="cp4d-backup-cpdctl-creds"
              export PVC_SIZE="1Gi"
              export MAX_PARALLEL="4"
              export EXPORT_TIMEOUT="900s"
              export ENCRYPTION_KEY=""                          # V1: plaintext bundle (see README §security)
              orchestrate.sh
