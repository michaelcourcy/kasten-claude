# PostgreSQL credentials used by the blueprint to authenticate to the database
# inside the Windows guest. The Secret MUST live in `kasten-io` (the namespace
# where the KubeTask pods run) because it is consumed via secretKeyRef env.
#
# Create it (do not commit real passwords):
#   kubectl create secret generic postgres-winvm-creds -n kasten-io \
#     --from-literal=password='<your-postgres-password>'
#
# The example below uses the test password `postgres`.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-winvm-creds
  namespace: kasten-io
type: Opaque
stringData:
  password: postgres
