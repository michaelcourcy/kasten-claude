# Kasten policy for the DataStage engine volumes.
#
# It protects the CP4D instance namespace (`cpd`) but with an include filter, because `cpd` holds
# the whole CP4D control plane — 30+ PVCs, Postgres, CouchDB, OpenSearch, Redis, RabbitMQ. Backing
# all of that up is platform DR (cpdbr's job, and a different conversation). This policy captures
# only what DataStage's engine owns.
#
# The filter has two kinds of entry, and both are needed. Read this before changing either:
#
# 1. The PVCs, selected by blueprint-ai/datastage-engine=true. The engine PVCs carry no usable label
#    of their own, so the operator applies this one by hand — see Prerequisites in README.md. The
#    blueprint reads the SAME label to decide what to flush and which snapshots to wait for, so the
#    snapshotted set, the flushed set and the checked set stay identical. THREE kinds of PVC must
#    carry it, and only the first two are obvious:
#      - datastage-ibm-datastage-ds-storage-pvc
#      - <instance>-ibm-datastage-px-storage-pvc, one per PXRuntime instance (`ds-px-default` is
#        the one the install creates; a namespace can have several instances)
#      - USER VOLUMES (volumes-<name>-pvc) — extra PVCs an administrator mounted into the runtime
#        so flows can read and write ordinary files. They hold customer data and the install does
#        not create them. `cpdctl dsjob list-volumes` reports the ones DataStage uses; do not
#        blanket-label every volumes-*-pvc, because other CP4D services create those too.
#
# 2. EVERY DataStage workload (icpdsupport/addOnId=datastage: 9 Deployments and the px-compute
#    StatefulSet on 4.8.9) — the same set the BlueprintBinding matches. A Kasten defect: it attributes
#    a shared RWX PVC to ONE of the workloads that mount it, picked non-deterministically, and only
#    that workload's backupPrehook holds back the snapshot. A workload outside the backup runs no
#    hook at all. So every workload that mounts an engine PVC must be both bound and included, or
#    the snapshot can start before the quiesce. (The 5.x policies include only the runtime
#    Deployment, and are exposed to exactly that.)
#
#    The cost: Kasten snapshots every PVC an included workload mounts, labelled or not. On 4.8.9
#    that adds two PVCs to the restore point:
#      - datastage-ibm-datastage-ds-migration-pvc (5 Gi, DataStage's migration scratch space);
#      - conn-home-pvc — Common Core Services', also mounted by the wdp-connect-* pods, which are
#        not DataStage workloads. Its snapshot is therefore not guaranteed to wait for the quiesce;
#        that does not matter, because this blueprint does not protect it and the restore
#        (README, Restore) never selects it.

# Nothing else is captured. The ds-config ConfigMap and the DataStage / PXRuntime custom resources
# were captured "for reference" in an earlier version but were never restored, and restoring the
# CRs over a live install could ask the operator to go back to an older version. See README.md.
#
# The profile MUST be a Location profile (S3/GCS/Azure Blob), not Infra — only a Location profile
# is recorded in the RestorePointContent in a Kanister-compatible form, which is what allows
# restorePosthook to run at all.
#   kubectl get profile <name> -n kasten-io -o jsonpath='{.spec.type}'   # must print: Location
apiVersion: config.kio.kasten.io/v1alpha1
kind: Policy
metadata:
  name: datastage-engine-backup
  namespace: kasten-io
spec:
  comment: >-
    DataStage engine volumes (/ds-storage, /px-storage) in the cpd namespace. Design assets
    (flows, jobs, connections) are covered by the cp4d-example project-export policy, not here.
  frequency: "@onDemand"
  actions:
    - action: backup
      backupParameters:
        profile:
          name: <your-location-profile>
          namespace: kasten-io
        filters:
          includeResources:
            # Every PVC the operator labelled: engine volumes, one px-storage per PXRuntime
            # instance, and any DataStage user volume. See note 1 above.
            - resource: persistentvolumeclaims
              matchLabels:
                blueprint-ai/datastage-engine: "true"
            # Every DataStage workload — the set the BlueprintBinding matches. See note 2 above.
            - group: apps
              resource: deployments
              matchLabels:
                icpdsupport/addOnId: datastage
            - group: apps
              resource: statefulsets
              matchLabels:
                icpdsupport/addOnId: datastage
  selector:
    matchExpressions:
      - key: k10.kasten.io/appNamespace
        operator: In
        values:
          - cpd
