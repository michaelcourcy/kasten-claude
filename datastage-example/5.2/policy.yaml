# Kasten policy for the DataStage engine volumes.
#
# It protects the CP4D instance namespace (`cpd`) but with an include filter, because `cpd` holds
# the whole CP4D control plane — 30+ PVCs, Postgres, CouchDB, OpenSearch, Redis, RabbitMQ. Backing
# all of that up is platform DR (cpdbr's job, and a different conversation). This policy captures
# only what DataStage's engine owns.
#
# The filter has exactly two entries, and both are needed. Read this before adding a third:
#
# 1. The PVCs, selected by blueprint-ai/datastage-engine=true. The two PVCs that matter carry NO
#    USABLE LABEL on DataStage 5.2.2 — verified on the cluster. Only ds-temp and ds-migration are
#    labelled (icpdsupport/addOnId: datastage), and those two are scratch space. So the operator
#    applies this label by hand — see Prerequisites in README.md. backupPrehook reads the SAME
#    label to decide what to flush, so the snapshotted set and the flushed set stay identical.
#    THREE kinds of PVC must carry it, and only the first two are obvious:
#      - datastage-ibm-datastage-ds-storage-pvc
#      - <instance>-ibm-datastage-px-storage-pvc, one per PXRuntime instance (`ds-px-default` is
#        the one the install creates; a namespace can have several instances)
#      - USER VOLUMES (volumes-<name>-pvc) — extra PVCs an administrator mounted into the runtime
#        so flows can read and write ordinary files. They hold customer data and the install does
#        not create them. `cpdctl dsjob list-volumes` reports the ones DataStage uses; do not
#        blanket-label every volumes-*-pvc, because other CP4D services create those too.
#
# 2. The ONE Deployment the BlueprintBinding matches (name=datastage AND component=runtime — both
#    labels sit in one matchLabels, so both must match). It is needed for two reasons:
#      - if the bound workload is not in the backup, its hooks never run (no precheck, no flush),
#        and the backup still reports Complete;
#      - if the bound workload is filtered out, Kasten does not snapshot the PVC it mounts
#        (ds-storage) — a Kasten defect, see "Three things about Kasten filters" in README.md.
#
#    Do NOT include the other DataStage workloads. Kasten snapshots every PVC that an included
#    workload mounts, whether that PVC is labelled or not. Including all of them, as an earlier
#    version of this policy did, added three unlabelled PVCs to every restore point: ds-temp,
#    ds-migration and conn-home-pvc. conn-home-pvc is not DataStage's at all — it belongs to
#    Common Core Services and is also mounted by the wdp-connect-* pods. The runtime Deployment
#    mounts ds-storage only, so including it adds nothing beyond the labelled set.
#
# The restore no longer needs the other workloads in the restore point either: prepare-restore.sh
# scales them down, using the selectors IBM's own datastage-maint-aux-br-cm lists for a restore.
#
# Nothing else is captured. The ds-config ConfigMap and the DataStage / PXRuntime custom resources
# were captured "for reference" in an earlier version but were never restored, and restoring the
# CRs over a live install could ask the operator to go back to an older version. See README.md.
#
# The profile MUST be a Location profile (S3/GCS/Azure Blob), not Infra — only a Location profile
# is recorded in the RestorePointContent in a Kanister-compatible form, which is what allows
# restorePosthook to run at all.
#   kubectl get profile <name> -n kasten-io -o jsonpath='{.spec.type}'   # must print: Location
apiVersion: config.kio.kasten.io/v1alpha1
kind: Policy
metadata:
  name: datastage-engine-backup
  namespace: kasten-io
spec:
  comment: >-
    DataStage engine volumes (/ds-storage, /px-storage) in the cpd namespace. Design assets
    (flows, jobs, connections) are covered by the cp4d-example project-export policy, not here.
  frequency: "@onDemand"
  actions:
    - action: backup
      backupParameters:
        profile:
          name: <your-location-profile>
          namespace: kasten-io
        filters:
          includeResources:
            # Every PVC the operator labelled: engine volumes, one px-storage per PXRuntime
            # instance, and any DataStage user volume. See note 1 above.
            - resource: persistentvolumeclaims
              matchLabels:
                blueprint-ai/datastage-engine: "true"
            # The bound workload, and only that one. See note 2 above.
            - group: apps
              resource: deployments
              matchLabels:
                app.kubernetes.io/name: datastage
                app.kubernetes.io/component: runtime
  selector:
    matchExpressions:
      - key: k10.kasten.io/appNamespace
        operator: In
        values:
          - cpd
