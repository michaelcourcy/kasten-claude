apiVersion: cr.kanister.io/v1alpha1
kind: Blueprint
metadata:
  name: tanzu-postgres-blueprint
  namespace: kasten-io
actions:
  backupPrehook:
    outputArtifacts:
      tanzuBackup:
        keyValue:
          backupName: "{{ .Phases.triggerPostgresBackup.Output.backupName }}"
          namespace: "{{ .Phases.triggerPostgresBackup.Output.namespace }}"
          instance: "{{ .Phases.triggerPostgresBackup.Output.instance }}"
          stanzaName: "{{ .Phases.triggerPostgresBackup.Output.stanzaName }}"
          restoreLabel: "{{ .Phases.triggerPostgresBackup.Output.restoreLabel }}"
    phases:
      - func: KubeTask
        name: triggerPostgresBackup
        args:
          namespace: kasten-io
          image: ghcr.io/kastenhq/blueprint-ai/kasten-tools:9.0.4
          command:
            - bash
            - -o
            - errexit
            - -o
            - pipefail
            - -c
            - |
              KEEPER="{{ .Object.metadata.name }}"
              NS="{{ .Object.metadata.namespace }}"
              INSTANCE="${KEEPER%-minio}"
              BACKUP_NAME="${INSTANCE}-kasten-$(date +%Y%m%d%H%M%S)"

              echo "Instance=${INSTANCE} namespace=${NS} backup=${BACKUP_NAME}"

              if ! kubectl get postgres.sql.tanzu.vmware.com "${INSTANCE}" -n "${NS}" >/dev/null 2>&1; then
                echo "ERROR: no Postgres instance '${INSTANCE}' in namespace ${NS}."
                echo "The MinIO Deployment must be named <instance-name>-minio."
                exit 1
              fi

              STATE=$(kubectl get postgres.sql.tanzu.vmware.com "${INSTANCE}" -n "${NS}" \
                -o jsonpath='{.status.currentState}' 2>/dev/null || echo "")
              echo "Instance state: ${STATE:-<empty>}"
              if [ "${STATE}" != "Running" ]; then
                echo "ERROR: instance is not Running — refusing to take a backup."
                exit 1
              fi

              # ---------------------------------------------------------------
              # 1. Trigger a full pgBackRest backup into the MinIO repository.
              # ---------------------------------------------------------------
              # `type` is a top-level spec field, and sourceInstance carries only
              # `name`. This was read off the 4.5.0 CRD itself, because the
              # published CRD reference nests `type` under sourceInstance and is
              # wrong: kubectl validates fields strictly, so the extra field makes
              # the API server reject the whole object with
              #   strict decoding error: unknown field "..."
              # `type` also accepts `differential` and `incremental`.
              kubectl create -n "${NS}" -f - <<EOF
              apiVersion: sql.tanzu.vmware.com/v1
              kind: PostgresBackup
              metadata:
                name: ${BACKUP_NAME}
                namespace: ${NS}
              spec:
                type: full
                sourceInstance:
                  name: ${INSTANCE}
              EOF

              # ---------------------------------------------------------------
              # 2. Wait for the backup to finish.
              # ---------------------------------------------------------------
              echo "Waiting for backup to complete (timeout 30m)..."
              ELAPSED=0
              PHASE=""
              while [ ${ELAPSED} -lt 1800 ]; do
                PHASE=$(kubectl get postgresbackup "${BACKUP_NAME}" -n "${NS}" \
                  -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                echo "  [${ELAPSED}s] phase: ${PHASE:-<empty>}"
                case "${PHASE}" in
                  Succeeded)
                    echo "Backup succeeded."
                    break
                    ;;
                  Failed)
                    echo "ERROR: backup failed."
                    kubectl get postgresbackup "${BACKUP_NAME}" -n "${NS}" -o yaml | tail -40
                    exit 1
                    ;;
                esac
                sleep 10
                ELAPSED=$((ELAPSED + 10))
              done

              if [ "${PHASE}" != "Succeeded" ]; then
                echo "ERROR: timed out after ${ELAPSED}s waiting for the backup."
                kubectl get postgresbackup "${BACKUP_NAME}" -n "${NS}" -o yaml | tail -40
                exit 1
              fi

              STANZA=$(kubectl get postgresbackup "${BACKUP_NAME}" -n "${NS}" \
                -o jsonpath='{.status.stanzaName}' 2>/dev/null || echo "")
              LABEL=$(kubectl get postgresbackup "${BACKUP_NAME}" -n "${NS}" \
                -o jsonpath='{.status.restoreLabel}' 2>/dev/null || echo "")
              echo "stanzaName=${STANZA} restoreLabel=${LABEL}"

              # ---------------------------------------------------------------
              # 3. Archive the open WAL segment, to improve the RPO.
              # ---------------------------------------------------------------
              # This is NOT needed to make the base backup restorable. pgBackRest
              # runs with archive-check=y (the default, and the operator does not
              # override it), so the backup only reports Succeeded once the WAL
              # required to make it consistent is already in the repository.
              #
              # What this step buys is recency. Transactions committed *after*
              # the base backup finished sit in the currently-open segment on the
              # primary's disk, and PostgreSQL archives only *complete* segments.
              # Kasten freezes the MinIO PVC seconds later, so without a switch
              # those commits are absent from the restore point and cannot be
              # recovered from it. Switching seals the segment and hands it to the
              # archiver now.
              #
              # The primary is needed only for this SQL call — the backup itself
              # is entirely the operator's job, and runs wherever it chooses.
              # pg_switch_wal() must run on the primary; a standby refuses it
              # with "recovery is in progress".
              PRIMARY=$(kubectl get pods -n "${NS}" \
                -l "postgres-instance=${INSTANCE},type=instance,role=primary" \
                -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")

              if [ -z "${PRIMARY}" ]; then
                echo "ERROR: could not find the primary pod for instance ${INSTANCE}."
                echo "Expected labels: postgres-instance=${INSTANCE},type=instance,role=primary"
                kubectl get pods -n "${NS}" --show-labels | head -20
                exit 1
              fi
              echo "Primary pod: ${PRIMARY}"

              # `kubectl exec` enters the container as its default OS user, and
              # psql with no -U authenticates as that user. On the 4.5.0 instance
              # image that user is `postgres`, a superuser, so a bare psql works
              # and this probe takes the first branch. The fallback exists because
              # the same call fails with 'role "root" does not exist' on images
              # that exec in as root. Probe once, reuse whichever form connects.
              PSQL_USER=""
              if ! kubectl exec -n "${NS}" "${PRIMARY}" -c pg-container -- \
                   psql -At -q -c "SELECT 1;" >/dev/null 2>&1; then
                echo "Bare psql did not connect; falling back to -U postgres."
                PSQL_USER="-U postgres"
              fi

              psql_q() {
                kubectl exec -n "${NS}" "${PRIMARY}" -c pg-container -- \
                  psql ${PSQL_USER} -At -q "$@"
              }

              # A switch only seals a segment if the current one has been written
              # to. On an idle instance right after a backup the segment can be
              # empty, in which case pg_switch_wal() does nothing and there is
              # nothing to wait for. Compare the segment before and after to tell
              # the two cases apart.
              BEFORE=$(psql_q -c "SELECT pg_walfile_name(pg_current_wal_lsn());")
              psql_q -c "SELECT pg_switch_wal();" >/dev/null
              AFTER=$(psql_q -c "SELECT pg_walfile_name(pg_current_wal_lsn());")

              if [ "${BEFORE}" = "${AFTER}" ]; then
                echo "Segment ${BEFORE} was empty; no switch occurred and nothing is pending."
              else
                echo "Sealed ${BEFORE}; waiting for it to reach the repository (timeout 5m)..."

                # Ask pgBackRest what is actually in MinIO. Do NOT use
                # pg_stat_archiver.last_archived_wal for this: with
                # archive-async=y and process-max=2 the segments are pushed in
                # parallel, so that column holds whichever archive_command
                # returned last, not the highest segment. It is not a monotonic
                # high-water mark, and it can also hold a ".backup" label or a
                # ".history" file, so comparing it with >= gives wrong answers.
                # The repository max is monotonic and is the thing we care about.
                repo_max() {
                  kubectl exec -n "${NS}" "${PRIMARY}" -c pg-container -- bash -c \
                    'pgbackrest info --stanza=${BACKUP_STANZA_NAME} --output=json 2>/dev/null | jq -r "[.[0].archive[].max] | max"' \
                    2>/dev/null || echo ""
                }

                ELAPSED=0
                ARCHIVED="no"
                while [ ${ELAPSED} -lt 300 ]; do
                  MAX=$(repo_max)
                  # Segment names are fixed-width zero-padded hex, so a lexical
                  # comparison is a valid ordering test between two of them.
                  if [ -n "${MAX}" ] && [ "${MAX}" != "null" ] \
                     && [[ "${MAX}" > "${BEFORE}" || "${MAX}" == "${BEFORE}" ]]; then
                    echo "  repository holds up to ${MAX} — ${BEFORE} is in MinIO."
                    ARCHIVED="yes"
                    break
                  fi
                  echo "  [${ELAPSED}s] repository max=${MAX:-<none>}"
                  sleep 5
                  ELAPSED=$((ELAPSED + 5))
                done

                if [ "${ARCHIVED}" != "yes" ]; then
                  # Deliberately not fatal. archive-check already guaranteed the
                  # base backup is restorable, so failing here would throw away a
                  # usable restore point. What is lost is only the ability to
                  # recover to a moment after the base backup finished.
                  echo "WARNING: ${BEFORE} did not reach the repository within ${ELAPSED}s."
                  echo "WARNING: the restore point is still restorable to the base backup,"
                  echo "WARNING: but transactions committed after it may not be recoverable."
                  echo "WARNING: check WAL archiving — pg_stat_archiver below:"
                  psql_q -c "SELECT * FROM pg_stat_archiver;" || true
                fi
              fi

              # ---------------------------------------------------------------
              # 4. Flush the keeper's page cache to the block device.
              # ---------------------------------------------------------------
              # A CSI snapshot captures the block device and bypasses the OS
              # page cache, and Kasten does not fsfreeze the filesystem. An
              # object MinIO has acknowledged but not yet flushed is captured as
              # a 0-byte file — the repository then looks complete but the
              # restore fails. The same root cause is documented in
              # cockroachdb-example, elasticsearch-eck-minio-example and
              # couchbase-operator-example.
              #
              # This is the last thing the prehook does, so nothing can dirty
              # the cache again before the snapshot is taken.
              #
              # The keeper pod is found through the Deployment's own selector
              # rather than a hardcoded label, so renaming the keeper's labels
              # cannot silently skip the flush.
              #
              # Built with jq, not `kubectl -o go-template`: Kanister renders
              # this script as a Go template before running it, so any
              # double-curly-brace expression here is consumed by Kanister and
              # never reaches kubectl. A go-template selector fails with
              # "can't evaluate field spec in type param.TemplateParams".
              # jq is safe because its interpolation syntax is \(...).
              SEL=$(kubectl get deployment "${KEEPER}" -n "${NS}" -o json \
                | jq -r '.spec.selector.matchLabels | to_entries | map("\(.key)=\(.value)") | join(",")')
              KEEPER_POD=$(kubectl get pods -n "${NS}" -l "${SEL}" \
                --field-selector=status.phase=Running \
                -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")

              if [ -z "${KEEPER_POD}" ]; then
                echo "ERROR: no running keeper pod for deployment ${KEEPER} (selector ${SEL})."
                exit 1
              fi

              echo "Syncing keeper filesystem (${KEEPER_POD})..."
              kubectl exec -n "${NS}" "${KEEPER_POD}" -- sync
              echo "Keeper filesystem synced."

              echo "MinIO PVC is ready for the Kasten snapshot."

              kando output backupName "${BACKUP_NAME}"
              kando output namespace "${NS}"
              kando output instance "${INSTANCE}"
              kando output stanzaName "${STANZA}"
              kando output restoreLabel "${LABEL}"

  delete:
    inputArtifactNames:
      - tanzuBackup
    phases:
      - func: KubeTask
        name: expirePostgresBackup
        args:
          namespace: kasten-io
          image: ghcr.io/kastenhq/blueprint-ai/kasten-tools:9.0.4
          command:
            - bash
            - -o
            - errexit
            - -o
            - pipefail
            - -c
            - |
              BACKUP_NAME="{{ .ArtifactsIn.tanzuBackup.KeyValue.backupName }}"
              NS="{{ .ArtifactsIn.tanzuBackup.KeyValue.namespace }}"

              echo "Expiring backup ${BACKUP_NAME} in namespace ${NS}..."

              if ! kubectl get namespace "${NS}" >/dev/null 2>&1; then
                echo "Namespace ${NS} no longer exists — nothing to do."
                exit 0
              fi

              if ! kubectl get postgresbackup "${BACKUP_NAME}" -n "${NS}" >/dev/null 2>&1; then
                echo "PostgresBackup ${BACKUP_NAME} does not exist — nothing to do."
                exit 0
              fi

              # Setting expire makes the operator run `pgbackrest expire`, which
              # removes the backup from the live MinIO repository. Deleting the CR
              # on its own would leave the data behind and the bucket would grow
              # without limit.
              kubectl patch postgresbackup "${BACKUP_NAME}" -n "${NS}" \
                --type merge -p '{"spec":{"expire":true}}'

              echo "Waiting for the expire job to finish (timeout 10m)..."
              ELAPSED=0
              while [ ${ELAPSED} -lt 600 ]; do
                if ! kubectl get postgresbackup "${BACKUP_NAME}" -n "${NS}" >/dev/null 2>&1; then
                  echo "Backup removed by the operator."
                  exit 0
                fi
                PHASE=$(kubectl get postgresbackup "${BACKUP_NAME}" -n "${NS}" \
                  -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                echo "  [${ELAPSED}s] phase: ${PHASE:-<empty>}"
                if [ "${PHASE}" = "Failed" ]; then
                  echo "WARNING: expire reported Failed; deleting the CR anyway."
                  break
                fi
                sleep 10
                ELAPSED=$((ELAPSED + 10))
              done

              # Remove the CR whether or not the operator already did. Restore-point
              # deletion must not be blocked by a stuck expire job.
              kubectl delete postgresbackup "${BACKUP_NAME}" -n "${NS}" --ignore-not-found
              echo "Done."
