# MinIO keeper for the Tanzu for Postgres pgBackRest repository.
#
# One MinIO Deployment per Postgres instance. The Deployment name must follow the
# convention <instance-name>-minio — the blueprint derives the Postgres instance name
# by stripping the "-minio" suffix.
#
# The single secret below serves two consumers at once:
#   - MinIO itself reads accessKeyId / secretAccessKey as its root credentials.
#   - PostgresBackupLocation requires a secret with exactly those two key names.
# Using one secret with the key names Tanzu mandates avoids duplicating the values.
apiVersion: v1
kind: Secret
metadata:
  name: pg-ha-minio-creds
  namespace: tanzu-postgres
type: Opaque
stringData:
  accessKeyId: minioadmin
  secretAccessKey: minioadmin123
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: pg-ha-minio-selfsigned
  namespace: tanzu-postgres
spec:
  selfSigned: {}
---
# MinIO must serve HTTPS. pgBackRest has no plaintext mode for an S3 repository,
# and PostgresBackupLocation's `enableSSL: false` does NOT mean "use HTTP" — the
# operator turns it into pgBackRest's `repo1-storage-verify-tls=n`, which only
# skips certificate verification. A plaintext MinIO therefore fails the stanza
# creation with "TLS error [1:167772427] wrong version number".
#
# Because verification is skipped, a self-signed certificate is enough and no CA
# bundle has to be distributed. cert-manager is already a prerequisite of the
# operator, so issuing one costs nothing.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pg-ha-minio-tls
  namespace: tanzu-postgres
spec:
  secretName: pg-ha-minio-tls
  issuerRef:
    name: pg-ha-minio-selfsigned
    kind: Issuer
  commonName: pg-ha-minio.tanzu-postgres.svc.cluster.local
  dnsNames:
    - pg-ha-minio
    - pg-ha-minio.tanzu-postgres
    - pg-ha-minio.tanzu-postgres.svc
    - pg-ha-minio.tanzu-postgres.svc.cluster.local
    - localhost
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-ha-minio
  namespace: tanzu-postgres
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ebs-sc
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-ha-minio
  namespace: tanzu-postgres
  labels:
    app: pg-ha-minio
    # The BlueprintBinding matches on this label.
    tanzu-postgres-minio: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pg-ha-minio
  strategy:
    # The PVC is ReadWriteOnce, so the new pod cannot attach while the old one holds
    # the volume. Recreate avoids a rollout deadlock.
    type: Recreate
  template:
    metadata:
      labels:
        app: pg-ha-minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-04-22T22-12-26Z
          args:
            - server
            - /data
            - --certs-dir
            - /certs
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: pg-ha-minio-creds
                  key: accessKeyId
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-ha-minio-creds
                  key: secretAccessKey
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          volumeMounts:
            - name: data
              mountPath: /data
            - name: certs
              mountPath: /certs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
              # MinIO now serves TLS on 9000, so the probe must use HTTPS.
              # Kubernetes does not verify the certificate for probes.
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pg-ha-minio
        - name: certs
          secret:
            secretName: pg-ha-minio-tls
            # MinIO expects public.crt / private.key; cert-manager writes
            # tls.crt / tls.key, so rename them on the way in.
            items:
              - key: tls.crt
                path: public.crt
              - key: tls.key
                path: private.key
---
apiVersion: v1
kind: Service
metadata:
  name: pg-ha-minio
  namespace: tanzu-postgres
spec:
  selector:
    app: pg-ha-minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
